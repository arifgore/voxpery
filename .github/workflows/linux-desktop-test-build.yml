# Linux desktop test build for the keyboard focus fix (B-020).
# Runs only for the fix branch, creates no release, and uploads the .deb as a workflow
# artifact for manual testing. Remove this workflow before merging the branch.
name: Linux Desktop Test Build

on:
  push:
    branches:
      - fix/linux-keyboard-focus
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-24.04
            bundles: deb
            args: ''
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-4-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev patchelf cmake ninja-build file

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Sync desktop version metadata
        run: node .github/scripts/sync-desktop-version.mjs

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node .github/scripts/inject-desktop-updater-key.mjs

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web UI
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache CEF distribution
        if: matrix.name == 'linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri-cef
          key: tauri-cef-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_LINUX_AYATANA_APPINDICATOR: '1'
        run: >-
          npx --yes @tauri-apps/cli@3.0.0-alpha.4 build ${{ matrix.args }}
          --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Report Linux packages
        if: matrix.name == 'linux'
        run: |
          ls -la ${{ matrix.bundle_dir }}/deb
          dpkg-deb --info ${{ matrix.bundle_dir }}/deb/*.deb | sed -n '1,40p'

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: voxpery-linux-keyboard-focus
          path: ${{ matrix.bundle_dir }}/deb/*.deb
          if-no-files-found: error
          retention-days: 14
