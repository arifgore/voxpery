# Tauri 3 desktop build check (B-007): Linux on Chromium (CEF), Windows/macOS on the system webview.
# Runs only for the feature branch, creates no release, and uploads the installers as workflow
# artifacts for manual testing. Remove this workflow before merging the branch.
name: Desktop Tauri 3 Check

on:
  push:
    branches:
      - feat/linux-cef-runtime
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tauri3-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-24.04
            bundles: deb,rpm
            args: ''
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
          - name: windows
            platform: windows-latest
            bundles: nsis
            args: ''
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
          - name: macos
            platform: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            bundle_dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-4-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev patchelf cmake ninja-build file

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Sync desktop version metadata
        run: node .github/scripts/sync-desktop-version.mjs

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node .github/scripts/inject-desktop-updater-key.mjs

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web UI
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache CEF distribution
        if: matrix.name == 'linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri-cef
          key: tauri-cef-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_LINUX_AYATANA_APPINDICATOR: '1'
        run: >-
          npx --yes @tauri-apps/cli@3.0.0-alpha.4 build ${{ matrix.args }}
          --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Report Linux packages
        if: matrix.name == 'linux'
        run: |
          ls -la ${{ matrix.bundle_dir }}/deb ${{ matrix.bundle_dir }}/rpm
          dpkg-deb --info ${{ matrix.bundle_dir }}/deb/*.deb | sed -n '1,40p'
          rpm -qpR ${{ matrix.bundle_dir }}/rpm/*.rpm | head -40

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: voxpery-${{ matrix.name }}-tauri3
          path: |
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/rpm/*.rpm
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
